name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: Run formatting, lint, type, and test checks
        run: bun run check

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: Build executable bundle
        run: bun run build.ts
      - name: Build standalone executable
        run: bun run build.ts --standalone
      - name: Package artifact
        run: |
          tar -czf dist/notae.tar.gz -C dist notæ
          sha256sum dist/notae.tar.gz > dist/notae.tar.gz.sha256
          tar -cJf dist/notae-standalone-linux-x64.tar.xz -C dist notæ-standalone
          sha256sum dist/notae-standalone-linux-x64.tar.xz > dist/notae-standalone-linux-x64.tar.xz.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: notae
          path: |
            dist/notae.tar.gz
            dist/notae.tar.gz.sha256
            dist/notae-standalone-linux-x64.tar.xz
            dist/notae-standalone-linux-x64.tar.xz.sha256
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: notae
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/notae.tar.gz \
            dist/notae.tar.gz.sha256 \
            dist/notae-standalone-linux-x64.tar.xz \
            dist/notae-standalone-linux-x64.tar.xz.sha256 \
            --repo "${GH_REPO}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
