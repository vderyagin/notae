<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <title>Notæ</title>
    <link
      rel="icon"
      sizes="any"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8.5' y='16.5' width='47' height='31' rx='2.5' fill='none' stroke='black' stroke-width='3'/%3E%3Cpath fill='black' d='M14 40V24h5l6 7 6-7h5v16h-5V31l-6 7-6-7v9zM41 24h6v9h7l-10 10-10-10h7z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app">
      <button
        id="sidebar-toggle"
        class="sidebar-toggle"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
        aria-label="Hide sidebar"
        title="Hide sidebar"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5" />
          <path d="M6 2.75v10.5" />
        </svg>
      </button>
      <aside class="sidebar" id="sidebar">
        <div class="search">
          <input
            id="search"
            type="search"
            placeholder="Search all markdown..."
            autocomplete="off"
          />
          <div id="status" class="status"></div>
        </div>
        <div id="tree" class="tree"></div>
        <div
          id="toc-resize-handle"
          class="toc-resize-handle hidden"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Resize headings panel"
          aria-valuemin="60"
          aria-valuemax="1000"
          aria-valuenow="240"
          tabindex="0"
        ></div>
        <div id="toc" class="toc hidden">
          <div class="toc-header">Headings</div>
          <div id="toc-list" class="toc-list"></div>
        </div>
      </aside>
      <div
        class="resize-handle"
        id="resize-handle"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        aria-valuemin="180"
        aria-valuemax="1000"
        aria-valuenow="300"
        tabindex="0"
      ></div>
      <main class="viewer">
        <article id="content" class="content">
          <div class="empty-state">
            <div class="empty-title">Nothing selected</div>
            <div class="empty-sub">Pick a markdown file from the sidebar.</div>
          </div>
        </article>
      </main>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
